name: Publish to Comfy Registry

# Publishes to https://registry.comfy.org, which is where ComfyUI Manager
# installs from. Runs when the version in pyproject.toml changes, so a normal
# code commit does not trigger a publish - bump the version when you want one.
# Can also be run by hand from the Actions tab.
#
# Needs two things set up once:
#   1. PublisherId filled in under [tool.comfy] in pyproject.toml
#   2. a repository secret named REGISTRY_ACCESS_TOKEN holding an API key
#      created at https://registry.comfy.org

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  publish:
    name: Publish custom node
    runs-on: ubuntu-latest
    # Never publishes from someone else's fork.
    if: github.repository_owner == 'HallettVisual'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Stops a release the Registry's security review would flag, since a flagged
      # version can only be installed as "nightly".
      # Patterns are written so this file never spells out the calls it looks for.
      - name: Check against the Registry's security rules
        shell: bash
        run: |
          files=$(git ls-files '*.py' '*.js' | grep -v '^[.]github/' || true)
          fail=0
          check() { if grep -nE "$2" $files; then echo "::error::$1"; fail=1; fi; }
          check "Environment variable read (python_environment_manipulation)" 'os[.](environ|getenv|putenv)|getenv[(]'
          check "Shell command" 'os[.](system|popen)[(]|shell *= *True'
          check "Dynamic code" '(^|[^.a-zA-Z_])(eval|exec)[(]|__import__[(]'
          check "Unsafe deserialisation" '(pickle|marshal)[.]loads?[(]'
          check "Installs packages at runtime" 'pip[.]main|pip +install|ensurepip'
          if grep -qE 'routes[.](get|post)|"[a-z_]*(path|folder|dir|file)[a-z_]*": *[(]"STRING"' $files \
             && ! grep -qE 'is_within_directory|commonpath' $files; then
            echo "::error::File paths from requests or inputs with no containment check (arbitrary-file-read)"; fail=1
          fi
          exit $fail

      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
